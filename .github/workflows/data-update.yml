name: Data Update
run-name: Refresh site data

on:
  # Runs at 4:00 UTC every day
  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  trigger-data-updates:
    name: Trigger data update tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The site the tasks are triggered on. A repository variable, so a fork
      # or a staging deployment can point somewhere else.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: University stats
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"university_stats"}'

      - name: Region rankings
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"region_rankings"}'

      - name: Campus rankings
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"campus_rankings"}'

      - name: Metro rankings
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"metro_rankings"}'

      - name: Admin stats snapshot
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"admin_stats_snapshot"}'

      - name: Meilisearch
        env:
          SSC_SECRET: ${{ secrets.SSC_SECRET }}
        run: |
          curl -fsS -X POST "${SITE_URL}/api/admin/data-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SSC_SECRET}" \
            -d '{"task":"meilisearch"}'
